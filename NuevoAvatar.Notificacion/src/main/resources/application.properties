spring.application.name=nuevo-avatar-notificacion

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=NuevoAvatar_Integracion;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.leak-detection-threshold=30000
spring.transaction.default-timeout=30s

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.port=8095

seguridad.service.url=${SEGURIDAD_URL:http://localhost:5158}
springdoc.swagger-ui.path=/swagger-ui.html

bitacora.service.url=${BITACORA_URL:http://localhost:5159}


integration.service=Notificacion
