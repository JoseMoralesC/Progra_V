spring.application.name=nuevo-avatar-persona2

# Configuro el destino y las credenciales localmente (PrograV por Tailscale).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Limito las transacciones y detecto conexiones retenidas.
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.leak-detection-threshold=30000
spring.transaction.default-timeout=30s

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8082
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

seguridad.service.url=${SEGURIDAD_URL:http://localhost:5158}
springdoc.swagger-ui.path=/swagger-ui.html
