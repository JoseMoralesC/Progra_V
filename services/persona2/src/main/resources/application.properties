spring.application.name=nuevo-avatar-persona2

spring.datasource.url=jdbc:sqlserver://db70273.public.databaseasp.net:1433;databaseName=db70273;encrypt=true;trustServerCertificate=true
spring.datasource.username=db70273
spring.datasource.password=${DB_PASSWORD}

# Mantener las transacciones acotadas y detectar conexiones retenidas.
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.leak-detection-threshold=30000
spring.transaction.default-timeout=30s

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8082
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

seguridad.service.url=${SEGURIDAD_URL:http://localhost:5158}
springdoc.swagger-ui.path=/swagger-ui.html
