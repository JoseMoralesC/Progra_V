spring.application.name=nuevo-avatar-prematricula
seguridad.service.url=${AUTENTICACION_BASE_URL}
seguridad.connect-timeout-ms=${SEGURIDAD_CONNECT_TIMEOUT_MS:3000}
seguridad.read-timeout-ms=${SEGURIDAD_READ_TIMEOUT_MS:5000}
direccion.service.url=${DIRECCION_BASE_URL}
matricula.service.url=${MATRICULA_BASE_URL}
notas.service.url=${NOTAS_BASE_URL}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.sql.init.mode=never

bitacora.service.url=${BITACORA_BASE_URL}


integration.service=Prematricula

parametro.service.url=${PARAMETRO_BASE_URL}
