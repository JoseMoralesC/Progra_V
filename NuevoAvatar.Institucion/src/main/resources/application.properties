spring.application.name=nuevo-avatar-institucion

# Configuro el destino y las credenciales localmente (PrograV por Tailscale).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Limito las transacciones y detecto conexiones retenidas.
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.leak-detection-threshold=30000
spring.transaction.default-timeout=30s

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

seguridad.service.url=${AUTENTICACION_BASE_URL}
springdoc.swagger-ui.path=/swagger-ui.html

bitacora.service.url=${BITACORA_BASE_URL}


integration.service=Institucion
